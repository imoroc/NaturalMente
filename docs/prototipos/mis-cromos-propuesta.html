  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; }
  button { font: inherit; }
  .demo {
    --ink: #f8f3e5;
    --soft: #c5d9cd;
    width: min(100%, 680px);
    margin-inline: auto;
    overflow: hidden;
    border-radius: 24px;
    background: #10251d;
    color: var(--ink);
  }
  .demo-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px 20px;
    padding: 16px clamp(16px, 4%, 26px);
    border-bottom: 1px solid #355148;
    background: #18342a;
  }
  h1 { margin: 0; font: 900 22px/1.12 Nunito, system-ui, sans-serif; }
  .finishes { display: flex; gap: 6px; flex-wrap: wrap; }
  .finishes button, .template {
    min-height: 40px;
    padding: 7px 12px;
    border: 1px solid #557167;
    border-radius: 99px;
    background: transparent;
    color: var(--ink);
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }
  .finishes button[aria-pressed="true"], .template[aria-pressed="true"] {
    color: #18342a;
    background: #e0f2e5;
    border-color: #e0f2e5;
  }
  button:focus-visible, .grip:focus-visible {
    outline: 3px solid #f8cf79;
    outline-offset: 4px;
  }
  .stage {
    padding: 34px 14px 17px;
    display: grid;
    justify-items: center;
    background:
      radial-gradient(ellipse at 50% 42%, #3d6651 0%, #244537 33%, transparent 65%),
      radial-gradient(ellipse at 50% 100%, #1a382d, transparent 60%),
      #10251d;
  }
  .grip {
    position: relative;
    width: clamp(176px, 63%, 237px);
    aspect-ratio: 5 / 7;
    display: grid;
    place-items: center;
    perspective: 780px;
    touch-action: pan-y;
    cursor: grab;
    border-radius: 18px;
    outline-offset: 9px;
    user-select: none;
  }
  .grip[data-dragging] { cursor: grabbing; }
  .grip::before {
    content: "";
    position: absolute;
    width: 102%;
    left: -1%;
    bottom: -15px;
    height: 23px;
    border-radius: 50%;
    background: #030c08;
    filter: blur(13px);
    opacity: .78;
  }
  .card {
    --rx: 0deg;
    --ry: 0deg;
    --light-x: 29%;
    --light-y: 17%;
    --foil-angle: 126deg;
    --edge: #777b66;
    --metal: #e6ede1;
    --foil: #fffae2, #b6d0ca 17%, #fcd0e0 35%, #fffdf2 48%, #b2ede0 64%, #bebde9 78%, #fff4cd 93%;
    --paper: #fcf0cf, #fdf8e7 44%, #e7f3e1 100%;
    --accent: #8b8368;
    position: absolute;
    inset: 0;
    border-radius: 6.8% / 4.85%;
    transform-style: preserve-3d;
    transform: rotateZ(-4deg)
      rotateX(clamp(-6deg, calc(3deg + var(--rx)), 6deg))
      rotateY(clamp(-8deg, calc(-5deg + var(--ry)), 8deg));
    transition: transform 280ms ease-out;
    box-shadow: 0 24px 36px #04191188;
    pointer-events: none;
  }
  [data-dragging] .card { transition: none; }
  .card[data-finish="laton"] {
    --edge: #765018;
    --metal: #e3aa48;
    --foil: #fff2b1, #b17c2c 18%, #f6d477 34%, #fff3b5 45%, #be8739 65%, #ebbd5f 81%, #fff2ba 94%;
    --paper: #f8e3a3, #fff4d0 45%, #f2c974;
    --accent: #92672e;
  }
  .back, .side, .face, .art, .nameplate { position: absolute; }
  .back, .side, .face { inset: 0; border-radius: inherit; }
  .back {
    transform: translateZ(-4px);
    border: 1px solid var(--metal);
    background: var(--edge);
  }
  .side {
    transform: translateZ(-2px);
    border: 1px solid var(--edge);
    background: var(--metal);
  }
  .face {
    overflow: hidden;
    border: 1px solid #fff9;
    background:
      radial-gradient(ellipse at var(--light-x) var(--light-y), #ffffffd9, transparent 40%),
      repeating-linear-gradient(119deg, #ffffff18 0 1px, #2827180c 1px 2px, transparent 2px 4px),
      linear-gradient(var(--foil-angle), var(--foil));
    box-shadow: inset 0 0 0 2px #fff7, inset 0 0 0 4px #161c1b27;
  }
  .paper {
    position: absolute;
    inset: 4.3% 6%;
    overflow: hidden;
    border: 1px solid var(--accent);
    border-radius: 6% / 4.2%;
    background:
      radial-gradient(ellipse at var(--light-x) var(--light-y), #ffffffa0, transparent 59%),
      repeating-linear-gradient(136deg, #fff2 0 1px, #492c200b 1px 2px, transparent 2px 4px),
      linear-gradient(145deg, var(--paper));
    box-shadow: 0 0 0 1px #fff8, inset 0 0 14px #482d1823;
  }
  .paper::before, .paper::after {
    content: "";
    position: absolute;
    width: 84%;
    aspect-ratio: 1;
    border-radius: 44%;
    border: 1px solid #fff7;
    box-shadow: 0 0 0 5px #ffffff28, 0 0 0 11px #ffffff26, 0 0 0 17px #ffffff24, 0 0 0 23px #ffffff22;
    transform: rotate(36deg);
  }
  .paper::before { top: -65%; left: -38%; }
  .paper::after { bottom: -63%; right: -26%; }
  .art {
    inset: 9% 9% 24%;
    width: 82%;
    height: 67%;
    object-fit: contain;
    transform: translateZ(13px);
    filter: drop-shadow(0 1px 0 #fff6e3) drop-shadow(0 3px 5px #291d1457);
    -webkit-user-drag: none;
  }
  .nameplate {
    inset: auto 13% 9%;
    padding: 7px 5px 8px;
    transform: translateZ(5px);
    text-align: center;
    border: 1px solid #ac8b53;
    border-radius: 12px;
    box-shadow: inset 0 0 0 1px #fff9, 0 3px 5px #38230c34;
    color: #1d3528;
    background: linear-gradient(140deg, #fff9e7, #f6e1aa);
  }
  .nameplate strong {
    display: block;
    font: 900 clamp(22px, 5vw, 31px)/1 Nunito, system-ui, sans-serif;
  }
  .nameplate span { display: block; margin-top: 3px; font-size: 12px; font-weight: 800; }
  .card[data-blank] .art, .card[data-blank] .nameplate { display: none; }
  .hint { margin: 23px 0 12px; color: var(--soft); font-size: 13px; text-align: center; }
  .still-hint { display: none; }
  .template { min-height: 44px; }
  .fact {
    max-width: 435px;
    margin: 0 auto;
    padding: 12px 16px 17px;
    color: var(--soft);
    text-align: center;
    font-size: 13px;
    line-height: 1.45;
  }
  .fact strong { color: var(--ink); }
  .fact[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .card { transform: none; transition: none; }
    .grip, .grip[data-dragging] { cursor: default; touch-action: auto; }
    .move-hint { display: none; }
    .still-hint { display: inline; }
  }

  .proposal { max-width: 490px; margin-inline: auto; }
  .demo { --text-dark: #1d3528; background: #f7f4eb; }
  .demo-bar {
    position: relative;
    min-height: 63px;
    justify-content: flex-start;
    flex-wrap: nowrap;
    padding: 8px 14px;
    gap: 7px;
    background: #fffdf7;
    color: var(--text-dark);
    border-color: #e8e0ce;
  }
  .back-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    background: transparent;
    border: 0;
    border-radius: 100%;
    color: #1d3528;
    cursor: pointer;
  }
  .back-button svg { width: 23px; height: 23px; }
  .stage {
    padding: 35px 14px 18px;

  .hint { margin: 21px 0 9px; color: #e0eee5; }
  .still-hint { display: none; }
  .rarity {
    margin: 0;
    padding: 3px 10px;
    border: 1px solid #efcd7b7d;
    border-radius: 99px;
    background: #f5dda919;
    color: #ffeab6;
    font-size: 12px;
    font-weight: 800;
  }
  .rarity[data-special="true"] {
    color: #e5fff4;
    border-color: #c4ecdc79;
    background: #c4ecdc19;
  }
  .panel {
    display: grid;
    justify-items: center;
    padding: 15px 16px;
    color: #1d3528;
  }
  .action {
    min-height: 44px;
    padding: 7px 18px;
    border: 0;
    border-radius: 99px;
    background: #dceee0;
    color: #18342a;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 12px;
    color: var(--foreground, #1d3528);
    font-size: 13px;
  }
  .tools .finishes button, .tools .template {
    min-height: 36px;
    border-color: var(--border, #a3b7a8);
    color: var(--foreground, #1d3528);
  }
  .tools button[aria-pressed="true"] {
    background: #dceee0;
    border-color: #9dbaa5;
    color: #18342a;
  }
  [hidden] { display: none !important; }
  dialog {
    width: min(90%, 395px);
    padding: 20px;
    border: 1px solid #daceb2;
    border-radius: 22px;
    background: #fffdf7;
    color: #1d3528;
  }
  dialog::backdrop { background: #0a2018a8; }
  dialog h2, .album h2 { margin: 0; font: 900 22px/1.2 Nunito, system-ui, sans-serif; }
  dialog p { line-height: 1.45; }
  .album { padding: 25px; color: #1d3528; }
  .mini {
    display: grid;
    justify-items: center;
    margin-top: 14px;
    padding: 10px;
    border: 2px solid #cc9b47;
    border-radius: 12px;
    background: #fff5d7;
    color: #1d3528;
    font-weight: 800;
    cursor: pointer;
  }
  .mini img { width: 95px; }
  @media (prefers-reduced-motion: reduce) { .hint { display: none; } }
</style>

        Camello
      </button>
    </section>
    <dialog aria-labelledby="fact-title">
      <h2 id="fact-title">Camello</h2>
      <p>Aguanta el calor del desierto y puede pasar varios días con muy poca agua.</p>
      <p><strong>Dato curioso de Natu</strong><br>Su joroba guarda reservas de grasa para tener energía, no una bolsa de agua.</p>
      <form method="dialog"><button class="action">¡Genial!</button></form>
    </dialog>
  </section>
  <div class="tools" aria-label="Controles de la maqueta">
    <span>Comparar acabados</span>
    <div class="finishes" role="group" aria-label="Acabado de muestra">
      <button type="button" data-finish="laton" aria-pressed="true">Latón</button>
      <button type="button" data-finish="nacar" aria-pressed="false">Nácar</button>
    </div>
    <button class="template" type="button" aria-pressed="false">Plantilla vacía</button>
  </div>
</main>
<script>
  const grip = document.querySelector('.grip');
  const card = document.querySelector('.card');
  const template = document.querySelector('.template');
  const rarity = document.querySelector('.rarity');
  const back = document.querySelector('.back-button');
  const album = document.querySelector('.album');
  const mini = document.querySelector('.mini');
  const preview = document.querySelector('.preview');
  const tools = document.querySelector('.tools');
  const about = document.querySelector('.about');
  const details = document.querySelector('dialog');
  const finishes = [...document.querySelectorAll('.finishes button')];
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
  const arrows = {
    ArrowUp: [0, -0.3],
    ArrowDown: [0, 0.3],
    ArrowLeft: [-0.3, 0],
    ArrowRight: [0.3, 0],
  };

  let drag;
  let x = 0;
  let y = 0;
  const clamp = (value) => Math.max(-1, Math.min(1, value));

  function tilt(nextX, nextY) {
    x = clamp(nextX);
    y = clamp(nextY);
    card.style.setProperty('--rx', (-6 * y) + 'deg');
    card.style.setProperty('--ry', (8 * x) + 'deg');
    card.style.setProperty('--light-x', (29 + 47 * x) + '%');
    card.style.setProperty('--light-y', (17 + 49 * y) + '%');
    card.style.setProperty('--foil-angle', (126 + 31 * x - 13 * y) + 'deg');
  }

  function endDrag() {
    if (!drag) return;
    const { id } = drag;
    drag = undefined;
    delete grip.dataset.dragging;
    if (grip.hasPointerCapture(id)) grip.releasePointerCapture(id);
    tilt(0, 0);
  }

  grip.addEventListener('pointerdown', (event) => {
    if (reducedMotion.matches || drag || !event.isPrimary || event.button !== 0) return;
    grip.focus({ preventScroll: true });
    drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
    grip.setPointerCapture(event.pointerId);
  });

  grip.addEventListener('pointermove', (event) => {
    if (drag?.id !== event.pointerId) return;
    const dx = event.clientX - drag.x;
    const dy = event.clientY - drag.y;
    if (!grip.hasAttribute('data-dragging')) {
      if (Math.abs(dy) > 6 && Math.abs(dy) > Math.abs(dx)) {
        endDrag();
        return;
      }
      if (Math.abs(dx) < 6) return;
      grip.dataset.dragging = '';
    }
    tilt(dx / 68, dy / 68);
  });

  for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    grip.addEventListener(name, (event) => {
      if (drag?.id === event.pointerId) endDrag();
    });
  }

  grip.addEventListener('keydown', (event) => {
    if (reducedMotion.matches || drag) return;
    if (event.key === 'Escape') {
      tilt(0, 0);
      return;
    }
    if (!Object.hasOwn(arrows, event.key)) return;
    event.preventDefault();
    const [dx, dy] = arrows[event.key];
    tilt(x + dx, y + dy);
  });
  grip.addEventListener('blur', () => {
    if (!drag) tilt(0, 0);
  });
  reducedMotion.addEventListener('change', () => {
    endDrag();
    tilt(0, 0);
  });

  for (const finish of finishes) {
    finish.addEventListener('click', () => {
      card.dataset.finish = finish.dataset.finish;
      updateFinish();
      tilt(0, 0);
      for (const option of finishes) {
        option.setAttribute('aria-pressed', String(option === finish));
      }
    });
  }

  function updateFinish() {
    const special = card.dataset.finish === 'nacar';
    const finishName = special ? 'Nácar especial' : 'Latón';
    const subject = card.hasAttribute('data-blank') ? 'Plantilla vacía' : 'Camello, La reserva';
    rarity.textContent = finishName;
    rarity.dataset.special = String(special);
    grip.setAttribute('aria-label', subject + ', ' + finishName);
  }

  template.addEventListener('click', () => {
    const blank = card.toggleAttribute('data-blank');
    template.setAttribute('aria-pressed', String(blank));
    about.hidden = blank;
    updateFinish();
  });

  function showAlbum(show) {
    preview.hidden = show;
    tools.hidden = show;
    back.hidden = show;
    album.hidden = !show;
    (show ? mini : back).focus();
  }

  back.addEventListener('click', () => showAlbum(true));
  mini.addEventListener('click', () => showAlbum(false));
  about.addEventListener('click', () => details.showModal());
</script>
</body>
