name: naturalmente
description: Ciencias de la naturaleza para primaria.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icono/icono.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDF6E2"
  adaptive_icon_foreground: "assets/icono/icono.png"

flutter:
  uses-material-design: true
  assets:
    - content/catalog.json
    - content/en.json
    - assets/icono/
    - assets/sonidos/

