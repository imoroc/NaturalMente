name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# En PRs se cancela el run anterior; en main nunca, para no cortar una release a medias.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verificar:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze --no-fatal-warnings
      - run: flutter test

  base-de-datos:
    name: Supabase (permisos e integración)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector
      - name: Permisos y reglas (pgTAP)
        run: supabase test db
      - name: La app contra Supabase
        run: |
          flutter pub get
          eval "$(supabase status -o env             --override-name api.url=SUPABASE_PRUEBAS_URL             --override-name auth.anon_key=SUPABASE_PRUEBAS_ANON             --override-name auth.service_role_key=SUPABASE_PRUEBAS_SERVICE             | grep SUPABASE_PRUEBAS_)"
          export SUPABASE_PRUEBAS_URL SUPABASE_PRUEBAS_ANON SUPABASE_PRUEBAS_SERVICE
          flutter test test/integracion

  panel:
    name: Panel web del profe
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # La URL y la clave publicable de producción irán en variables del
      # repositorio cuando se despliegue el panel. La clave publicable no es secreta.
      - run: >
          flutter build web --release -t lib/main_panel.dart -o build/panel
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: panel
          path: build/panel
          if-no-files-found: error
          retention-days: 7

  android:
    name: APK
    needs: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Sin estas variables la app funciona igual, pero Aula dice que no está disponible.
      - run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk naturalmente.apk
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: naturalmente.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: IPA sin firmar
    needs: verificar
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Sin estas variables la app funciona igual, pero Aula dice que no está disponible.
      - run: >
          flutter build ios --release --no-codesign
          --dart-define=SUPABASE_URL=${{ vars.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ vars.SUPABASE_ANON_KEY }}
      - run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r naturalmente.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: naturalmente.ipa
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publicar release latest
    needs: [android, ios]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS="Build automática del commit ${GITHUB_SHA::7} en main"
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" -F force=true
            gh release upload latest dist/naturalmente.apk dist/naturalmente.ipa \
              --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest --title "Última versión" --notes "$NOTAS" \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest dist/naturalmente.apk dist/naturalmente.ipa \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Última versión" \
              --notes "$NOTAS"
          fi
